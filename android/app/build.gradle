plugins { id 'com.android.application' }

def repoRoot = rootProject.projectDir.parentFile
def cmakeSource = new File(repoRoot, 'CMakeLists.txt').text
def versionMatch = cmakeSource =~ /project\(lamborghini_modern VERSION (\d+)\.(\d+)\.(\d+)/
if (!versionMatch.find()) throw new GradleException('Cannot read version from CMakeLists.txt')
def major = versionMatch.group(1).toInteger()
def minor = versionMatch.group(2).toInteger()
def patch = versionMatch.group(3).toInteger()

android {
    namespace 'io.github.alondero.lamborghinirecomp'
    compileSdk 35
    lint { lintConfig file('../lint.xml') }
    defaultConfig {
        applicationId 'io.github.alondero.lamborghinirecomp'
        testInstrumentationRunner "io.github.alondero.lamborghinirecomp.DriverImportInstrumentation"
        minSdk 26
        targetSdk 35
        versionCode major * 1000000 + minor * 1000 + patch
        versionName "${major}.${minor}.${patch}"
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets.main {
        java.srcDir "${repoRoot}/build-android/deps/SDL/android-project/app/src/main/java"
        jniLibs.srcDir "${repoRoot}/build-android/package/jniLibs"
        assets.srcDir "${repoRoot}/build-android/package/assets"
    }
    packagingOptions.jniLibs.useLegacyPackaging = true // AdrenoTools loads hooks from nativeLibraryDir.
}

tasks.register('checkReleaseSigning') {
    doLast {
        ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Release signing requires ${it}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseSigning' }
