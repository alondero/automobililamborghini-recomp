name: Build and release texture pack

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin tool inputs so a pack can be rebuilt from the same source commit.
  RT64_TOOLS_URL: https://github.com/rt64/rt64/releases/download/texture_pack_tools/texture_pack_tools_windows_v9.zip
  RT64_TOOLS_SHA256: F8C5A9D093F3538BEFD9E78B0502F104C8605DDB0EF4E3ACCA2706EC9A2B3C1D
  TEXCONV_URL: https://github.com/microsoft/DirectXTex/releases/download/may2026/texconv.exe
  TEXCONV_SHA256: DCFDEC10244E02CF5037FBA089C55FB7E1326B1C8181742D77D15FA5CB5EEF06

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout pack source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned RT64 texture tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'rt64-texture-tools'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $zip = Join-Path $toolRoot 'texture_pack_tools_windows_v9.zip'
          Invoke-WebRequest -Uri $env:RT64_TOOLS_URL -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:RT64_TOOLS_SHA256) { throw "RT64 tools checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $toolRoot 'expanded') -Force
          $packer = Get-ChildItem -LiteralPath (Join-Path $toolRoot 'expanded') -Recurse -File -Filter 'texture_packer.exe' | Select-Object -First 1
          if (-not $packer) { throw 'texture_packer.exe was not found in the RT64 tools archive' }
          "RT64_PACKER=$($packer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download pinned DirectXTex texconv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $texconv = Join-Path $env:RUNNER_TEMP 'texconv.exe'
          Invoke-WebRequest -Uri $env:TEXCONV_URL -OutFile $texconv
          if (-not (Test-Path -LiteralPath $texconv -PathType Leaf)) { throw 'texconv download failed' }
          $actual = (Get-FileHash -LiteralPath $texconv -Algorithm SHA256).Hash
          if ($actual -ne $env:TEXCONV_SHA256) { throw "texconv checksum mismatch: $actual" }
          "TEXCONV=$texconv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate source and licensing gate
        shell: pwsh
        run: python tools/validate_pack.py --pack-json pack.json --source-dir textures --rt64-json rt64.json --for-release

      - name: Build RT64 archive
        shell: pwsh
        run: |
          $tagArgs = @()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagArgs = @('--release-tag', $env:GITHUB_REF_NAME)
          }
          python tools/build_pack.py `
            --pack-json pack.json `
            --source-dir textures `
            --policy texture-policy.json `
            --output-dir dist `
            --texconv "$env:TEXCONV" `
            --rt64-packer "$env:RT64_PACKER" `
            --for-release @tagArgs

      - name: Upload manual-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: automobili-lamborghini-texture-pack
          path: |
            dist/*.rtz
            dist/SHA256SUMS
            dist/pack.json
            dist/CREDITS.md
            dist/NOTICE.md
            dist/PROVENANCE.md
            dist/LICENSE
            dist/LICENSE.md
          retention-days: 14

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -LiteralPath dist -File -Filter '*.rtz' | Select-Object -First 1
          if (-not $archive) { throw 'No .rtz archive was produced' }
          $assets = @(
            $archive.FullName,
            (Join-Path (Resolve-Path dist) 'SHA256SUMS'),
            (Join-Path (Resolve-Path dist) 'pack.json'),
            (Join-Path (Resolve-Path dist) 'CREDITS.md'),
            (Join-Path (Resolve-Path dist) 'NOTICE.md'),
            (Join-Path (Resolve-Path dist) 'PROVENANCE.md'),
            (Join-Path (Resolve-Path dist) 'LICENSE'),
            (Join-Path (Resolve-Path dist) 'LICENSE.md')
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $notes = @"
          Automobili Lamborghini RT64 texture pack.

          * Target: USA revision (see pack.json for the ROM SHA-1)
          * Variant: HD
          * Archive SHA-256: $((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash)
          * Install: configure the port's texture_pack setting or LAMBO_TEXTURE_PACK to this .rtz file.

          This draft contains replacement artwork only. Users must supply their own legally acquired game copy.
          Review CREDITS.md, NOTICE.md, and the compatibility metadata before publishing.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'texture-pack-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $assets `
            --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title $env:GITHUB_REF_NAME --notes-file $notesPath
