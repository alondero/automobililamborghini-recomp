[manifest]
id = "lambo_jp_weather"
version = "0.2.0"
display_name = "JP weather (experimental)"
description = "Japanese race-slot weather on the USA cartridge. Development build."
authors = ["Lamborghini Recompiled contributors"]
game_id = "lamborghini"
minimum_recomp_version = "0.10.3"

[[manifest.config_options]]
id = "weather.mode"
name = "Weather"
description = "US default disables overrides. Otherwise selects time-trial/single-race weather; championship uses the round settings below."
type = "Enum"
options = ["US default", "Dry", "Wet", "Night"]
default = "US default"

[[manifest.config_options]]
id = "weather.round1"
name = "Championship round 1"
description = "Weather for this race slot, regardless of circuit. Used when Weather is enabled."
type = "Enum"
options = ["Dry", "Wet", "Night"]
default = "Dry"

