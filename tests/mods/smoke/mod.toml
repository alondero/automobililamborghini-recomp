[manifest]
id = "lambo_mod_smoke"
version = "1.0.0"
display_name = "Mod execution smoke test"
description = "Checks init/race/frame callbacks, data, extensions, stores, native/UI imports and mod config. Developer test only."
authors = ["Lamborghini Recompiled contributors"]
game_id = "lamborghini"
minimum_recomp_version = "0.5.0"

[[manifest.native_libraries]]
name = "lambo_mod_native_smoke"
funcs = ["lambo_native_smoke"]

[[manifest.config_options]]
id = "mode"
name = "Smoke test mode"
description = "Selects the configuration-read marker. Does not change gameplay."
type = "Enum"
options = ["Default", "Override"]
default = "Default"

[inputs]
elf_path = "../../../build/mod-smoke/smoke.elf"
mod_filename = "lambo_mod_smoke"
func_reference_syms_file = "../../../lamborghini.syms.toml"
data_reference_syms_files = ["../../../lamborghini.datasyms.toml"]
